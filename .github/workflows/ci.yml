name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; the docker job widens this for itself only.
permissions:
  contents: read

# A new push to a PR cancels its superseded run. Runs on main are never cancelled, so every commit there is built.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Caches the Gradle distribution and dependency cache; only main writes to the cache.
      - uses: gradle/actions/setup-gradle@v6

      # Formatting, compilation, unit and @WebMvcTest slices, Testcontainers integration tests against postgres:16.2
      # with the real Liquibase migrations (Docker is preinstalled on GitHub-hosted runners), and the 80% line-coverage
      # gate wired into `check`.
      - name: Verify
        run: ./gradlew spotlessCheck build

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests/test/
          if-no-files-found: ignore

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html/
          if-no-files-found: ignore

  docker:
    name: Docker image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      # GHCR requires lower-case repository names; github.repository keeps the owner's original casing.
      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Built and loaded into the local daemon first so that it can be scanned; it is only pushed if the scan passes.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # trivy-action publishes no major-version tag, and tags are mutable, so it is pinned to a full commit SHA.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library

      # Pushes the exact image that was scanned, rather than rebuilding it.
      - name: Push image
        if: env.PUSH == 'true'
        run: docker push --all-tags "$IMAGE"
