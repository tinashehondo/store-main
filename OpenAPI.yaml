openapi: 3.0.0
info:
  title: store
  version: '1.0'
  description: >-
    A simple store. Errors are RFC 7807 `application/problem+json` bodies whose `status` always matches the HTTP status
    and which never contain stack traces, SQL or parser messages. Besides the responses listed per operation, any path
    answers 405 (with an `Allow` header) to a method it does not support, and 406 when the `Accept` header excludes
    JSON; both are problem+json too. JSON request bodies with a repeated key are rejected as malformed (400). The API has
    no authentication.
  contact:
    name: SecuritEase Dev
    url: 'https://www.securitease.com'
    email: internal@securitease.com
  termsOfService: 'https://www.securitease.com'
  license:
    name: Apache 2.0
    url: 'https://www.apache.org/licenses/LICENSE-2.0.htm'
# No authentication (yet): every operation is public.
security: []
servers:
  - url: 'http://localhost:8080'
    description: dev
paths:
  /order:
    get:
      summary: Get Orders
      tags:
        - store
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: >-
            One page, ordered by id ascending. The body is a plain array; paging metadata is in the headers.
          headers:
            X-Total-Count:
              $ref: '#/components/headers/X-Total-Count'
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: getOrders
      description: >-
        Get one page of orders, each with its customer and its products (sorted by id). Orders created before products
        existed have an empty `products` list.
    post:
      summary: Create Order
      tags:
        - store
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: createOrder
      description: >-
        Create a new order for an existing customer, containing one or more existing products. Returns 422 if
        `customerId` does not reference an existing customer, or if any of `productIds` does not reference an existing
        product (the `detail` then lists every missing id, e.g. "Product ids [7, 9] do not exist"). The customer is
        checked first: when it is unknown, the 422 reports only the customer, and unknown products are reported once it
        is fixed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
  '/order/{id}':
    get:
      summary: Get Order
      tags:
        - store
      parameters:
        - name: id
          in: path
          required: true
          description: Id of the order. Ids that are 0 or negative do not exist (404).
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: The id is blank or not a valid 64-bit integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: getOrder
      description: Get one order by id, with its customer and its products (sorted by id).
  /customer:
    get:
      summary: Get Customers
      tags:
        - store
      parameters:
        - name: name
          in: query
          required: false
          description: >-
            Optional search term. When present, only customers whose name contains it are returned: a
            case-insensitive substring match anywhere in the name (e.g. `onnel` and `MURIEL` both match
            "Muriel Donnelly"), so a term containing a space can match across words. Leading and trailing whitespace
            is ignored; `%`, `_` and `\` are matched literally, not as wildcards. A blank value (including one made
            only of Unicode whitespace such as an em space), a NUL character or more than 255 characters is rejected
            with 400. Results are paginated exactly like the unfiltered list.
          schema:
            type: string
            minLength: 1
            maxLength: 255
          example: onnel
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: >-
            One page, ordered by id ascending. The body is a plain array; paging metadata is in the headers.
          headers:
            X-Total-Count:
              $ref: '#/components/headers/X-Total-Count'
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: getCustomers
      description: >-
        Get one page of customers, optionally filtered by `name`, each with all of its orders (sorted by id). Note that
        the embedded orders are not paginated.
    post:
      summary: Create Customer
      tags:
        - store
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: createCustomer
      description: Create a new customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
  /products:
    get:
      summary: Get Products
      tags:
        - store
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: >-
            One page, ordered by id ascending. The body is a plain array; paging metadata is in the headers.
          headers:
            X-Total-Count:
              $ref: '#/components/headers/X-Total-Count'
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: getProducts
      description: >-
        Get one page of products, each with the ids of all orders that contain it (sorted ascending). Note that the
        order ids are not paginated. The path is plural, unlike `/customer` and `/order`.
    post:
      summary: Create Product
      tags:
        - store
      responses:
        '201':
          description: Created. A new product is in no order yet, so `orders` is empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: createProduct
      description: Create a new product. Products are added to orders when the order is created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
  '/products/{id}':
    get:
      summary: Get Product
      tags:
        - store
      parameters:
        - name: id
          in: path
          required: true
          description: Id of the product. Ids that are 0 or negative do not exist (404).
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: The id is blank or not a valid 64-bit integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: getProduct
      description: Get one product by id, with the ids of all orders that contain it (sorted ascending).
components:
  parameters:
    Page:
      name: page
      in: query
      description: >-
        Zero-based page index. A page past the end returns an empty array. At most 21474836, so that the row offset
        fits in 32 bits; a larger value is rejected with 400.
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 21474836
        default: 0
    Size:
      name: size
      in: query
      description: >-
        Page size, at most 100. Larger values are not rejected but clamped to 100 (the `Link` header then carries
        `size=100`); values below 1 are rejected with 400.
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 20
  headers:
    X-Total-Count:
      description: Total number of elements across all pages.
      schema:
        type: integer
        format: int64
    Link:
      description: >-
        RFC 8288 links to other pages, with relations first, prev (when page > 0), next (when a later page exists)
        and last. The links carry the effective (possibly clamped) size and keep any other query parameters.
      schema:
        type: string
      example: >-
        <http://localhost:8080/order?page=0&size=20>; rel="first", <http://localhost:8080/order?page=2&size=20>;
        rel="prev", <http://localhost:8080/order?page=4&size=20>; rel="next",
        <http://localhost:8080/order?page=500&size=20>; rel="last"
  responses:
    BadRequest:
      description: Validation failed, or the request body or a query parameter is malformed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetail'
    NotFound:
      description: The resource identified by the path does not exist
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: The request conflicts with a data integrity constraint
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    UnprocessableEntity:
      description: >-
        The request body references a resource id that does not exist (an unknown `customerId`, or one or more unknown
        `productIds`, all of which are listed in `detail`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    UnsupportedMediaType:
      description: The request body is not `application/json`
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    InternalServerError:
      description: Unexpected server error. No internal details are returned.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    Order:
      title: Order
      type: object
      required: [id, description, customer, products]
      properties:
        id:
          type: integer
          format: int64
        description:
          type: string
        customer:
          type: object
          required: [id, name]
          properties:
            id:
              type: integer
              format: int64
            name:
              type: string
        products:
          type: array
          description: The products of the order, sorted by id. Empty for orders created before products existed.
          items:
            type: object
            required: [id, description]
            properties:
              id:
                type: integer
                format: int64
              description:
                type: string
    Product:
      title: Product
      type: object
      required: [id, description, orders]
      properties:
        id:
          type: integer
          format: int64
        description:
          type: string
        orders:
          type: array
          description: Ids of all orders that contain this product, sorted ascending.
          items:
            type: integer
            format: int64
    Customer:
      title: Customer
      type: object
      required: [id, name, orders]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        orders:
          type: array
          description: All orders of the customer, sorted by id. Not paginated.
          items:
            type: object
            required: [id, description]
            properties:
              id:
                type: integer
                format: int64
              description:
                type: string
    CreateOrderRequest:
      title: CreateOrderRequest
      type: object
      required:
        - description
        - customerId
        - productIds
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 255
          description: Must not be blank or contain a NUL character.
        customerId:
          type: integer
          format: int64
          description: Id of an existing customer.
        productIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          description: >-
            Ids of existing products, at least one. Duplicates are ignored. Items must not be null.
          items:
            type: integer
            format: int64
    CreateProductRequest:
      title: CreateProductRequest
      type: object
      required:
        - description
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 255
          description: Must not be blank or contain a NUL character.
    CreateCustomerRequest:
      title: CreateCustomerRequest
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Must not be blank or contain a NUL character.
    ProblemDetail:
      title: ProblemDetail
      description: RFC 7807 problem details
      type: object
      required: [type, title, status, instance]
      properties:
        type:
          type: string
          format: uri
          example: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
          description: The request path, e.g. `/order/999`.
    ValidationProblemDetail:
      title: ValidationProblemDetail
      allOf:
        - $ref: '#/components/schemas/ProblemDetail'
        - type: object
          properties:
            errors:
              description: Present when bean validation failed; one entry per invalid field.
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                  message:
                    type: string
tags:
  - name: store
    description: store operations
